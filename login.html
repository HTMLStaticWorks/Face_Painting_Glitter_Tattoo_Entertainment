<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SparkleMagic Entertainment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
</head>

<body class="login-page">
    <!-- Floating Particles -->
    <div id="particles-container"></div>
    <div class="auth-top-actions d-flex align-items-center gap-3">
        <button id="darkModeToggle" class="btn btn-link text-decoration-none p-0 fs-5"><i class="bi bi-moon-stars"></i></button>
        <button id="rtlToggle" class="btn btn-link text-decoration-none p-0 fs-5"><i class="bi bi-translate"></i></button>
    </div>

    <main class="min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5 reveal">
                    <div class="card-luxury p-5">
                    <div class="text-center mb-4">
                        <a href="index.html" class="text-decoration-none">
                            <span class="brand-font fs-3 fw-bold" style="color: #ff4fa3;">Sparkle<span
                                    style="color: #8b5cf6;">Magic</span></span>
                        </a>
                    </div>
                    <h2 class="brand-font text-center mb-4">Welcome Back!</h2>

                    <!-- Social Login -->
                    <div class="d-grid gap-3 mb-4 auth-social-stack">
                        <button
                            class="btn btn-outline-light text-dark shadow-sm d-flex align-items-center justify-content-center gap-2 py-2 glass-effect border-1 auth-social-btn">
                            <i class="bi bi-google text-danger"></i> Continue with Google
                        </button>
                        <button
                            class="btn btn-outline-light text-dark shadow-sm d-flex align-items-center justify-content-center gap-2 py-2 glass-effect border-1 auth-social-btn">
                            <i class="bi bi-facebook text-primary"></i> Continue with Facebook
                        </button>
                        <button
                            class="btn btn-outline-light text-dark shadow-sm d-flex align-items-center justify-content-center gap-2 py-2 glass-effect border-1 auth-social-btn">
                            <i class="bi bi-apple text-dark"></i> Continue with Apple
                        </button>
                    </div>

                    <div class="d-flex align-items-center gap-3 mb-4">
                        <hr class="flex-grow-1 opacity-25">
                        <span class="small text-secondary fw-bold">OR</span>
                        <hr class="flex-grow-1 opacity-25">
                    </div>

                    <form>
                        <div class="mb-3">
                            <label class="form-label accent-font small fw-bold">Email Address</label>
                            <input type="email" class="form-control p-3 border-0 bg-light shadow-none"
                                placeholder="name@example.com">
                        </div>
                        <div class="mb-4">
                            <label class="form-label accent-font small fw-bold">Password</label>
                            <div class="auth-password-wrap">
                                <input type="password" id="loginPassword" class="form-control p-3 border-0 bg-light shadow-none"
                                    placeholder="Enter password">
                                <button type="button" class="auth-password-toggle" data-toggle-password="#loginPassword" aria-label="Show password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mt-2">
                                <div class="form-check mb-0">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label small text-secondary" for="rememberMe">Remember me</label>
                                </div>
                                <a href="#" class="small text-primary-accent text-decoration-none">Forgot password?</a>
                            </div>
                        </div>
                        <button type="submit" class="btn-premium w-100 py-3 fs-5 mb-4">Sign In</button>
                    </form>

                    <p class="text-center text-secondary small mb-0">
                        Don't have an account? <a href="signup.html"
                            class="text-secondary-accent fw-bold text-decoration-none">Create Account</a>
                    </p>
                </div>

                    <div class="text-center mt-4">
                        <a href="index.html" class="text-secondary small text-decoration-none">Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
