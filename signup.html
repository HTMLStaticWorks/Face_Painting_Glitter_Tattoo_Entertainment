<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | SparkleMagic</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
</head>
<body class="signup-page">
    <!-- Floating Particles -->
    <div id="particles-container"></div>
    <div class="auth-top-actions d-flex align-items-center gap-3">
        <button id="darkModeToggle" class="btn nav-utility-btn" type="button" aria-label="Toggle theme"><i class="bi bi-moon-stars"></i></button>
        <button id="rtlToggle" class="btn nav-utility-btn" type="button" aria-label="Toggle RTL mode">RTL</button>
    </div>

    <main class="min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5 reveal">
                    <div class="card-luxury p-5">
                    <div class="text-center mb-4">
                        <a href="index.html" class="text-decoration-none">
                            <span class="brand-logo" aria-label="SparkleMagic">
    <span class="brand-logo-icon" aria-hidden="true"><i class="bi bi-stars"></i></span>
    <span class="brand-logo-text"><span class="brand-logo-sparkle">Sparkle</span><span class="brand-logo-magic">Magic</span></span>
</span>
                        </a>
                    </div>
                    <h2 class="brand-font text-center mb-2">Create Account</h2>
                    <p class="text-center text-secondary small mb-4">Join our community for faster booking and event tips.</p>
                    
                    <!-- Social Login -->
                    <div class="d-grid gap-3 mb-4 auth-social-stack">
                        <button class="btn btn-outline-light text-dark shadow-sm d-flex align-items-center justify-content-center gap-2 py-2 glass-effect border-1 auth-social-btn">
                            <i class="bi bi-google text-danger"></i> Sign up with Google
                        </button>
                        <button class="btn btn-outline-light text-dark shadow-sm d-flex align-items-center justify-content-center gap-2 py-2 glass-effect border-1 auth-social-btn">
                            <i class="bi bi-facebook text-primary"></i> Sign up with Facebook
                        </button>
                        <button class="btn btn-outline-light text-dark shadow-sm d-flex align-items-center justify-content-center gap-2 py-2 glass-effect border-1 auth-social-btn">
                            <i class="bi bi-apple text-dark"></i> Sign up with Apple
                        </button>
                    </div>

                    <div class="d-flex align-items-center gap-3 mb-4">
                        <hr class="flex-grow-1 opacity-25">
                        <span class="small text-secondary fw-bold">OR EMAIL</span>
                        <hr class="flex-grow-1 opacity-25">
                    </div>

                    <form>
                        <div class="mb-3">
                            <label class="form-label accent-font small fw-bold">First Name</label>
                            <input type="text" class="form-control p-3 border-0 bg-light shadow-none" placeholder="John">
                        </div>
                        <div class="mb-3">
                            <label class="form-label accent-font small fw-bold">Last Name</label>
                            <input type="text" class="form-control p-3 border-0 bg-light shadow-none" placeholder="Doe">
                        </div>
                        <div class="mb-3">
                            <label class="form-label accent-font small fw-bold">Email Address</label>
                            <input type="email" class="form-control p-3 border-0 bg-light shadow-none" placeholder="name@example.com">
                        </div>
                        <div class="mb-4">
                            <label class="form-label accent-font small fw-bold">Password</label>
                            <div class="auth-password-wrap">
                                <input type="password" id="signupPassword" class="form-control p-3 border-0 bg-light shadow-none" placeholder="Create password">
                                <button type="button" class="auth-password-toggle" data-toggle-password="#signupPassword" aria-label="Show password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn-premium w-100 py-3 fs-5 mb-4">Join SparkleMagic</button>
                    </form>

                    <p class="text-center text-secondary small mb-0">
                        Already have an account? <a href="login.html" class="text-secondary-accent fw-bold text-decoration-none">Sign In</a>
                    </p>
                </div>

                    <div class="text-center mt-4">
                        <a href="index.html" class="text-secondary small text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

  

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
